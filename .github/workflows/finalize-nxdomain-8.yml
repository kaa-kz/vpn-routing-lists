name: Finalize 8 unresolved NXDOMAIN hostnames

on:
  workflow_dispatch:
  push:
    branches:
      - build-ru-blocked-server-allow-20260826
    paths:
      - .github/workflows/finalize-nxdomain-8.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          ref: build-ru-blocked-server-allow-20260826
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install dnspython

      - name: Validate input
        run: |
          python -m py_compile scripts/confirm_nxdomain.py
          python - <<'PY'
          from pathlib import Path
          p = Path('generated/domain-check/recheck-nxdomain/04_UNCERTAIN_RECHECK.txt')
          items = [x.strip() for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(items) == 8, len(items)
          assert len(items) == len(set(items))
          print('validated_final_nxdomain_input=8')
          PY

      - name: Run final low-load DNS confirmation
        id: confirm
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/confirm_nxdomain.py \
            --input generated/domain-check/recheck-nxdomain/04_UNCERTAIN_RECHECK.txt \
            --output-dir generated/domain-check/recheck-nxdomain-final-8 \
            --state-dir state/recheck-nxdomain-final-8 \
            --expected-count 8 \
            --concurrency 1 \
            --dns-query-concurrency 2 \
            --dns-timeout 10 \
            --hostname-hard-timeout 240 \
            --max-authoritative-ns 8 \
            --progress-every 1 \
            --heartbeat-seconds 20 \
            --watchdog-seconds 300 \
            --checkpoint-every 1 \
            --checkpoint-seconds 30 \
            --soft-limit-seconds 3000 \
            --git-checkpoint \
            2>&1 | tee finalize-nxdomain-8.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Persist results
        if: always()
        run: |
          git add state/recheck-nxdomain-final-8 generated/domain-check/recheck-nxdomain-final-8 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Persist final 8 NXDOMAIN recheck results"
            git push origin HEAD:build-ru-blocked-server-allow-20260826
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-nxdomain-8-diagnostics
          retention-days: 30
          if-no-files-found: warn
          path: |
            finalize-nxdomain-8.log
            state/recheck-nxdomain-final-8/
            generated/domain-check/recheck-nxdomain-final-8/

      - name: Fail if final check failed
        if: always()
        run: |
          code="${{ steps.confirm.outputs.exit_code }}"
          echo "final_confirm_exit_code=$code"
          if [ -z "$code" ] || [ "$code" != "0" ]; then
            exit 1
          fi
