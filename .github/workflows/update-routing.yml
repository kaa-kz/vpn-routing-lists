name: Update routing lists

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 1 * *"
  push:
    branches:
      - main
    paths:
      - "source/**"
      - "scripts/**"
      - "happ/**"
      - ".github/workflows/update-routing.yml"

permissions:
  contents: write

concurrency:
  group: routing-lists-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          ref: master
          path: community

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: community/go.mod
          cache-dependency-path: community/go.sum

      - name: Build custom source and client lists
        run: |
          python scripts/build.py \
            --community-data community/data \
            --publish publish

      - name: Build complete geosite.dat
        run: |
          cd community
          go mod download
          go run ./
          test -s dlc.dat
          mv dlc.dat ../publish/geosite.dat

      - name: Generate Happ release profiles
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          now = str(int(time.time()))
          publish = Path("publish")
          for src, dst in [
              (Path("happ/routing-mobile.json"), publish / "happ-routing-mobile.json"),
              (Path("happ/routing-desktop.json"), publish / "happ-routing-desktop.json"),
          ]:
              data = json.loads(src.read_text(encoding="utf-8"))
              data["LastUpdated"] = now
              dst.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate generated artifacts
        run: |
          test -s publish/geosite.dat
          test -s publish/ru-blocked-custom.txt
          test -s publish/shadowrocket-ru-blocked.list
          test -s publish/build-metadata.json
          test -s publish/happ-routing-mobile.json
          test -s publish/happ-routing-desktop.json

          if grep -Eiq '(^|\.)cloudflare-dns\.com$' publish/ru-blocked-custom.txt; then
            echo "ERROR: cloudflare-dns.com is still present in ru-blocked-custom"
            exit 1
          fi

          if grep -Eiq '^DOMAIN-SUFFIX,cloudflare-dns\.com$' publish/shadowrocket-ru-blocked.list; then
            echo "ERROR: cloudflare-dns.com is still present in Shadowrocket list"
            exit 1
          fi

          (cd publish && sha256sum geosite.dat ru-blocked-custom.txt shadowrocket-ru-blocked.list > SHA256SUMS)

      - name: Add release README
        run: |
          cat > publish/README.md <<'EOF'
          # Generated VPN routing artifacts

          This branch is generated automatically. Do not edit it manually.

          Files:
          - `geosite.dat` — complete v2fly geosite database plus `geosite:ru-blocked-custom`.
          - `ru-blocked-custom.txt` — plain custom blocked-domain suffixes.
          - `shadowrocket-ru-blocked.list` — Shadowrocket remote rule-set source.
          - `happ-routing-mobile.json` — Happ starter profile with FakeDNS enabled.
          - `happ-routing-desktop.json` — Happ starter profile with FakeDNS disabled.
          - `build-metadata.json` — source URLs, counts and exclusions applied.
          - `SHA256SUMS` — artifact checksums.
          EOF

      - name: Publish release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -- README.md SHA256SUMS build-metadata.json geosite.dat ru-blocked-custom.txt shadowrocket-ru-blocked.list happ-routing-mobile.json happ-routing-desktop.json
          git commit -m "Update routing lists $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin release
