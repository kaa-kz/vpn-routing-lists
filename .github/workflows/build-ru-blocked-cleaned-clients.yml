name: Build ru-blocked-cleaned client artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - build-ru-blocked-server-allow-20260826
    paths:
      - scripts/build_ru_blocked_cleaned_clients.py
      - scripts/merge_runetfreedom_geosite.go
      - .github/workflows/build-ru-blocked-cleaned-clients.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  BRANCH_NAME: build-ru-blocked-server-allow-20260826
  INPUT_FILE: generated/final/ru-blocked-server-allow.cleaned.txt
  OUTPUT_DIR: generated/clients/ru-blocked-cleaned
  EXPECTED_COUNT: "15759"
  EXPECTED_INPUT_SHA256: 1ed42c3c9a577c6ceb0cbc276e3a903033c08e8f43d66dbcf3c5a8583e2531c6
  RUNETFREEDOM_GEOSITE_URL: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat
  RUNETFREEDOM_SHA_URL: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat.sha256sum

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          ref: build-ru-blocked-server-allow-20260826
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical input
        shell: bash
        run: |
          set -euo pipefail
          test -f "$INPUT_FILE"
          actual_count="$(sed '/^[[:space:]]*$/d' "$INPUT_FILE" | wc -l | tr -d ' ')"
          actual_sha="$(sha256sum "$INPUT_FILE" | awk '{print $1}')"
          test "$actual_count" = "$EXPECTED_COUNT"
          test "$actual_sha" = "$EXPECTED_INPUT_SHA256"
          echo "canonical_count=$actual_count"
          echo "canonical_sha256=$actual_sha"

      - name: Build exact hostname text artifacts
        run: |
          python scripts/build_ru_blocked_cleaned_clients.py \
            --input "$INPUT_FILE" \
            --output-dir "$OUTPUT_DIR" \
            --expected-count "$EXPECTED_COUNT"

      - name: Download and verify Runet Freedom geosite.dat
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/runetfreedom
          mkdir -p /tmp/runetfreedom
          curl -fL --retry 4 --retry-delay 5 --connect-timeout 20 \
            "$RUNETFREEDOM_GEOSITE_URL" -o /tmp/runetfreedom/geosite.dat
          curl -fL --retry 4 --retry-delay 5 --connect-timeout 20 \
            "$RUNETFREEDOM_SHA_URL" -o /tmp/runetfreedom/geosite.dat.sha256sum

          upstream_expected="$(awk '{print $1}' /tmp/runetfreedom/geosite.dat.sha256sum | head -n1 | tr -d '\r')"
          upstream_actual="$(sha256sum /tmp/runetfreedom/geosite.dat | awk '{print $1}')"
          test "${#upstream_expected}" = "64"
          test "$upstream_actual" = "$upstream_expected"

          upstream_size="$(stat -c '%s' /tmp/runetfreedom/geosite.dat)"
          test "$upstream_size" -gt 1000000
          test "$upstream_size" -lt 100000000

          echo "RUNETFREEDOM_SHA256=$upstream_actual" >> "$GITHUB_ENV"
          echo "RUNETFREEDOM_SIZE_BYTES=$upstream_size" >> "$GITHUB_ENV"
          echo "runetfreedom_sha256=$upstream_actual"
          echo "runetfreedom_size_bytes=$upstream_size"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: false

      - name: Merge full Runet Freedom geosite with ru-blocked-cleaned
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/domain-list-community
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git /tmp/domain-list-community
          cd /tmp/domain-list-community
          go mod download
          cp "$GITHUB_WORKSPACE/scripts/merge_runetfreedom_geosite.go" ./merge_runetfreedom_geosite.go

          go run ./merge_runetfreedom_geosite.go \
            --base=/tmp/runetfreedom/geosite.dat \
            --canonical="$GITHUB_WORKSPACE/$INPUT_FILE" \
            --output="$GITHUB_WORKSPACE/$OUTPUT_DIR/geosite.dat" \
            --category=RU-BLOCKED-CLEANED \
            --expected-count="$EXPECTED_COUNT" \
            | tee "$GITHUB_WORKSPACE/$OUTPUT_DIR/merge-validation.txt"

          rm -f ./merge_runetfreedom_geosite.go

      - name: Cross-check text artifacts and build manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re

          root = Path(os.environ['OUTPUT_DIR'])
          expected = int(os.environ['EXPECTED_COUNT'])
          source = Path(os.environ['INPUT_FILE'])
          shadow = root / 'ru-blocked-cleaned.list'
          geo_source = root / 'geosite-source' / 'ru-blocked-cleaned'
          plain = root / 'ru-blocked-cleaned.txt'
          dat = root / 'geosite.dat'
          validation = root / 'merge-validation.txt'

          canonical = [x.strip() for x in source.read_text(encoding='utf-8').splitlines() if x.strip()]
          shadow_domains = [x.split(',', 1)[1] for x in shadow.read_text(encoding='utf-8').splitlines() if x]
          source_lines = [x.strip() for x in geo_source.read_text(encoding='utf-8').splitlines() if x.strip()]
          source_domains = [x[5:] for x in source_lines if x.startswith('full:')]

          # Keep this human-readable geosite-source export reproducible too.
          plain.write_text(geo_source.read_text(encoding='utf-8'), encoding='utf-8')
          plain_lines = [x.strip() for x in plain.read_text(encoding='utf-8').splitlines() if x.strip()]
          plain_domains = [x[5:] for x in plain_lines if x.startswith('full:')]

          assert len(canonical) == expected
          assert len(set(canonical)) == expected
          assert shadow_domains == canonical
          assert source_domains == canonical
          assert plain_domains == canonical
          assert dat.stat().st_size > int(os.environ['RUNETFREEDOM_SIZE_BYTES'])

          validation_text = validation.read_text(encoding='utf-8')
          def metric(name: str) -> int:
              m = re.search(rf'^{re.escape(name)}=(\d+)$', validation_text, re.M)
              assert m, f'missing metric {name}'
              return int(m.group(1))

          source_categories = metric('source_category_count')
          removed_target = metric('source_existing_target_categories_removed')
          preserved_categories = metric('preserved_upstream_category_count')
          output_categories = metric('output_category_count')
          target_count = metric('target_exact_full_count')

          assert preserved_categories == source_categories - removed_target
          assert output_categories == preserved_categories + 1
          assert target_count == expected

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = root / 'manifest.txt'
          manifest.write_text(
              '\n'.join([
                  'RU-BLOCKED-CLEANED CLIENT ARTIFACTS',
                  '===================================',
                  f'hostname_count={expected}',
                  'matching_semantics=exact_hostname',
                  'shadowrocket_rule_type=DOMAIN',
                  'happ_geosite_category=geosite:ru-blocked-cleaned',
                  'happ_geosite_base=runetfreedom/russia-v2ray-rules-dat@release',
                  f'runetfreedom_geosite_sha256={os.environ["RUNETFREEDOM_SHA256"]}',
                  f'runetfreedom_geosite_size_bytes={os.environ["RUNETFREEDOM_SIZE_BYTES"]}',
                  f'runetfreedom_source_category_count={source_categories}',
                  f'runetfreedom_existing_target_removed={removed_target}',
                  f'preserved_upstream_category_count={preserved_categories}',
                  f'merged_output_category_count={output_categories}',
                  f'canonical_input_sha256={sha(source)}',
                  f'shadowrocket_list_sha256={sha(shadow)}',
                  f'geosite_dat_sha256={sha(dat)}',
                  f'geosite_dat_size_bytes={dat.stat().st_size}',
                  f'geosite_plain_sha256={sha(plain)}',
                  '',
              ]),
              encoding='utf-8',
          )

          branch = os.environ['BRANCH_NAME']
          base = f'https://raw.githubusercontent.com/kaa-kz/vpn-routing-lists/{branch}/generated/clients/ru-blocked-cleaned'
          usage = root / 'USAGE.txt'
          usage.write_text(
              '\n'.join([
                  'Shadowrocket:',
                  f'RULE-SET,{base}/ru-blocked-cleaned.list,DIRECT',
                  '',
                  'Happ:',
                  f'Geositeurl: {base}/geosite.dat',
                  'The geosite.dat above contains the full Runet Freedom geosite plus our category.',
                  'DirectSites: geosite:ru-blocked-cleaned',
                  '',
              ]),
              encoding='utf-8',
          )
          print(manifest.read_text(encoding='utf-8'))
          PY

      - name: Persist generated client artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add "$OUTPUT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Merge Runet Freedom geosite with ru-blocked-cleaned"
            git push origin HEAD:build-ru-blocked-server-allow-20260826
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ru-blocked-cleaned-clients
          retention-days: 30
          path: generated/clients/ru-blocked-cleaned/
