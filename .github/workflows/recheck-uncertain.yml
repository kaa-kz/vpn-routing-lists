name: Recheck uncertain hostnames

on:
  workflow_dispatch:
  push:
    branches:
      - build-ru-blocked-server-allow-20260826
    paths:
      - scripts/recheck_uncertain.py
      - .github/workflows/recheck-uncertain.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          ref: build-ru-blocked-server-allow-20260826
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp dnspython

      - name: Static validation
        run: |
          python -m py_compile scripts/recheck_uncertain.py
          python - <<'PY'
          from pathlib import Path
          p = Path('generated/domain-check/04_UNCERTAIN_RECHECK.txt')
          items = [x.strip() for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(items) == 8189, len(items)
          assert len(items) == len(set(items)), 'duplicate hostnames in 04 input'
          print(f'validated_uncertain_input={len(items)}')
          PY

      - name: Run strict uncertain recheck
        id: recheck
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/recheck_uncertain.py \
            --input generated/domain-check/04_UNCERTAIN_RECHECK.txt \
            --output-dir generated/domain-check/recheck-04 \
            --state-dir state/recheck-04 \
            --expected-count 8189 \
            --concurrency 12 \
            --dns-query-concurrency 18 \
            --dns-timeout 4 \
            --dns-hard-timeout 22 \
            --http-connect-timeout 4 \
            --http-total-timeout 12 \
            --hostname-hard-timeout 50 \
            --max-redirects 10 \
            --progress-every 50 \
            --heartbeat-seconds 30 \
            --watchdog-seconds 120 \
            --checkpoint-every 250 \
            --checkpoint-seconds 180 \
            --soft-limit-seconds 19200 \
            --git-checkpoint \
            2>&1 | tee recheck-uncertain.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Persist final state and outputs
        if: always()
        run: |
          git add state/recheck-04 generated/domain-check/recheck-04 recheck-uncertain.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Persist uncertain hostname recheck results"
            git push origin HEAD:build-ru-blocked-server-allow-20260826
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uncertain-recheck-diagnostics
          if-no-files-found: warn
          retention-days: 30
          path: |
            recheck-uncertain.log
            state/recheck-04/
            generated/domain-check/recheck-04/

      - name: Fail if recheck failed or paused
        if: always()
        run: |
          code="${{ steps.recheck.outputs.exit_code }}"
          echo "recheck_exit_code=$code"
          if [ -z "$code" ] || [ "$code" != "0" ]; then
            exit 1
          fi
