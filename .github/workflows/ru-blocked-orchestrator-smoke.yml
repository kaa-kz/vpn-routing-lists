name: ru-blocked orchestrator smoke

on:
  push:
    branches:
      - build-ru-blocked-server-allow-20260826
    paths:
      - scripts/ru_blocked_orchestrator.py
      - scripts/check_hostnames.py
      - scripts/recheck_uncertain.py
      - scripts/confirm_nxdomain.py
      - scripts/build_ru_blocked_cleaned_clients.py
      - scripts/merge_runetfreedom_geosite.go
      - config/ru-blocked-suffixes.txt
      - .github/workflows/monthly-ru-blocked-orchestrator.yml
      - .github/workflows/ru-blocked-orchestrator-smoke.yml
      - baselines/manual-2026-08-27/**

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-ru-blocked-server-allow-20260826

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: false

      - name: Install DNS/web dependencies
        run: python -m pip install --disable-pip-version-check aiohttp dnspython

      - name: Compile implementation and validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/ru_blocked_orchestrator.py \
            scripts/check_hostnames.py \
            scripts/recheck_uncertain.py \
            scripts/confirm_nxdomain.py \
            scripts/build_ru_blocked_cleaned_clients.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/monthly-ru-blocked-orchestrator.yml'); puts 'monthly workflow YAML: OK'"

      - name: Verify frozen baselines
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -cv '^[[:space:]]*$' baselines/manual-2026-08-27/ru-blocked-cleaned-15759.txt)" = "15759"
          test "$(grep -cv '^[[:space:]]*$' baselines/manual-2026-08-27/confirmed-nxdomain-6230.txt)" = "6230"
          test "$(git hash-object baselines/manual-2026-08-27/ru-blocked-cleaned-15759.txt)" = "9844ca804ca003b111b72e38d7724d81ab766f49"
          test "$(git hash-object baselines/manual-2026-08-27/confirmed-nxdomain-6230.txt)" = "52ddc1ef0f419679d5cbd23563b04769925a1dc2"

      - name: Run real Stage 1 FAST without publication
        shell: bash
        run: |
          set -euo pipefail
          run_id="smoke-fast-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "FAST_RUN_ID=$run_id" >> "$GITHUB_ENV"
          python scripts/ru_blocked_orchestrator.py stage1 \
            --run-id "$run_id" \
            --nxdomain-mode fast \
            --suffix-file config/ru-blocked-suffixes.txt

      - name: Validate Stage 1 FAST outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = Path('runs') / os.environ['FAST_RUN_ID']
          state = json.loads((run/'state.json').read_text())
          manifest = json.loads((run/'manifest.json').read_text())
          comparison = json.loads((run/'05_comparison/summary.json').read_text())
          assert state['status'] == 'STAGE1_COMPLETE', state
          assert manifest['mode'] == 'FAST', manifest
          assert manifest['filtered_count'] == 21989, manifest
          assert manifest['cleaned_count'] == 15759, manifest
          assert manifest['cleaned_sha256'] == '1ed42c3c9a577c6ceb0cbc276e3a903033c08e8f43d66dbcf3c5a8583e2531c6', manifest
          assert comparison['added'] == 0 and comparison['removed'] == 0, comparison
          print(json.dumps({
              'run_id': manifest['run_id'],
              'filtered_count': manifest['filtered_count'],
              'cleaned_count': manifest['cleaned_count'],
              'cleaned_sha256': manifest['cleaned_sha256'],
              'added_vs_manual': comparison['added'],
              'removed_vs_manual': comparison['removed'],
          }, indent=2))
          PY

      - name: Run Stage 2 without publication
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ru_blocked_orchestrator.py stage2 --run-id "$FAST_RUN_ID"

      - name: Validate Stage 2 outputs and no publication
        shell: bash
        run: |
          set -euo pipefail
          out="runs/$FAST_RUN_ID/06_clients"
          test -s "$out/ru-blocked-cleaned.list"
          test -s "$out/geosite.dat"
          test -s "$out/manifest.json"
          test "$(wc -l < "$out/ru-blocked-cleaned.list" | tr -d ' ')" = "15759"
          test "$(stat -c '%s' "$out/geosite.dat")" -gt 70000000
          git diff --exit-code -- generated/clients/ru-blocked-cleaned
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = Path('runs') / os.environ['FAST_RUN_ID']
          state = json.loads((run/'state.json').read_text())
          manifest = json.loads((run/'06_clients/manifest.json').read_text())
          rules = (run/'06_clients/ru-blocked-cleaned.list').read_text().splitlines()
          assert state['status'] == 'STAGE2_COMPLETE', state
          assert manifest['hostname_count'] == 15759, manifest
          assert manifest['happ_category'] == 'geosite:ru-blocked-cleaned', manifest
          assert manifest['shadowrocket'].endswith('/ru-blocked-cleaned.list,PROXY'), manifest
          assert len(rules) == 15759 and all(x.startswith('DOMAIN,') for x in rules), 'bad Shadowrocket list'
          print(json.dumps({
              'hostname_count': manifest['hostname_count'],
              'happ_category': manifest['happ_category'],
              'shadowrocket_rule': manifest['shadowrocket'],
              'geosite_sha256': manifest['geosite_sha256'],
              'geosite_bytes': (run/'06_clients/geosite.dat').stat().st_size,
          }, indent=2))
          PY

      - name: Run tiny Stage 1 FULL without NXDOMAIN DB promotion
        shell: bash
        run: |
          set -euo pipefail
          printf 'ru.net\n' > /tmp/full-smoke-suffixes.txt
          run_id="smoke-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "FULL_RUN_ID=$run_id" >> "$GITHUB_ENV"
          python scripts/ru_blocked_orchestrator.py stage1 \
            --run-id "$run_id" \
            --nxdomain-mode full \
            --suffix-file /tmp/full-smoke-suffixes.txt

      - name: Validate tiny FULL outputs and current NXDOMAIN DB unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object generated/automation/nxdomain/confirmed-current.txt)" = "52ddc1ef0f419679d5cbd23563b04769925a1dc2"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = Path('runs') / os.environ['FULL_RUN_ID']
          state = json.loads((run/'state.json').read_text())
          manifest = json.loads((run/'manifest.json').read_text())
          summary = json.loads((run/'04_final/summary.json').read_text())
          filtered = (run/'02_filtered/ru-blocked-filtered.txt').read_text().splitlines()
          assert state['status'] == 'STAGE1_COMPLETE', state
          assert manifest['mode'] == 'FULL', manifest
          assert len(filtered) == 5, filtered
          assert summary['input'] == 5, summary
          assert summary['cleaned'] + summary['confirmed_nxdomain'] == 5, summary
          assert not manifest.get('update_nxdomain_db', False)
          print(json.dumps({
              'run_id': manifest['run_id'],
              'filtered_count': len(filtered),
              'confirmed_nxdomain': summary['confirmed_nxdomain'],
              'unresolved_keep': summary['unresolved_keep'],
              'cleaned_count': summary['cleaned'],
          }, indent=2))
          PY

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru-blocked-smoke-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            runs/smoke-fast-${{ github.run_id }}-${{ github.run_attempt }}/
            runs/smoke-full-${{ github.run_id }}-${{ github.run_attempt }}/
