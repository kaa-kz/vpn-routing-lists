name: Fix canonical cleaned list to 15767

on:
  push:
    branches:
      - build-ru-blocked-server-allow-20260826
    paths:
      - '.github/workflows/fix-canonical-15767.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-ru-blocked-server-allow-20260826
          fetch-depth: 0
      - name: Remove zonafilm.ru only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('generated/final/ru-blocked-server-allow.cleaned.txt')
          lines=[x.strip() for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(lines)==15768, len(lines)
          assert lines.count('zonafilm.ru')==1
          lines=[x for x in lines if x!='zonafilm.ru']
          assert len(lines)==15767
          assert len(set(lines))==15767
          required={'lord-film.ru','kinogo.ru','hdrezka.ru','filmix.ru','gidonline.ru','lordfilm.ru','kinobar.ru','kinogo-net.ru'}
          assert required <= set(lines)
          assert 'kinokrad.ru' not in lines
          p.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated/final/ru-blocked-server-allow.cleaned.txt
          git commit -m 'Remove zonafilm.ru from canonical cleaned list'
          git push origin HEAD:build-ru-blocked-server-allow-20260826
