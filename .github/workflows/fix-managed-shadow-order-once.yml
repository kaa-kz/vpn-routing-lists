name: Fix managed Shadowrocket order once

on:
  push:
    branches:
      - build-ru-blocked-server-allow-20260826
    paths:
      - '.github/workflows/fix-managed-shadow-order-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-ru-blocked-server-allow-20260826
          fetch-depth: 0
      - name: Patch Shadowrocket managed order
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_client_bundle.go')
          s=p.read_text()
          start=s.index('    // Shadowrocket: explicit first-match rules.')
          end=s.index('    srBytes := []byte(b.String())', start)
          old=s[start:end]
          new=r'''    // Shadowrocket: explicit first-match rules. All managed PROXY rules must precede all managed DIRECT rules.
    var b strings.Builder
    ruleCount := 0
    b.WriteString("# Generated client routing rules. Rule order is significant.\n")
    b.WriteString("# All managed PROXY rules precede all managed DIRECT rules.\n")
    b.WriteString("[Rule]\n")
    b.WriteString("# ru-blocked-cleaned -> PROXY\n")
    for _, v := range ru { b.WriteString(fmt.Sprintf("DOMAIN,%s,PROXY\n", v)); ruleCount++ }

    siteMap := map[string]*router.GeoSite{}
    for _, site := range base.Entry { siteMap[strings.ToUpper(site.CountryCode)] = site }
    categoryCounts := map[string]int{}

    // First emit selected Runet Freedom PROXY categories.
    for _, cp := range policy.Categories {
        if cp.Policy != "PROXY" { continue }
        site := siteMap[cp.Name]
        if site == nil { failf("Runet category not found: %s", cp.Name) }
        b.WriteString(fmt.Sprintf("# geosite:%s -> %s\n", strings.ToLower(cp.Name), cp.Policy))
        seen := map[string]bool{}
        for _, d := range site.Domain {
            line := convertDomain(d, cp.Policy)
            if seen[line] { continue }
            seen[line] = true
            b.WriteString(line+"\n")
            ruleCount++
            categoryCounts[strings.ToLower(cp.Name)]++
        }
    }

    b.WriteString("# SERVER_BLOCK -> DIRECT\n")
    for _, v := range serverDomains { b.WriteString(fmt.Sprintf("DOMAIN-SUFFIX,%s,DIRECT\n", v)); ruleCount++ }
    for _, v := range serverIPv4 { b.WriteString(fmt.Sprintf("IP-CIDR,%s,DIRECT,no-resolve\n", v)); ruleCount++ }

    // Then emit selected Runet Freedom DIRECT categories.
    for _, cp := range policy.Categories {
        if cp.Policy != "DIRECT" { continue }
        site := siteMap[cp.Name]
        if site == nil { failf("Runet category not found: %s", cp.Name) }
        b.WriteString(fmt.Sprintf("# geosite:%s -> %s\n", strings.ToLower(cp.Name), cp.Policy))
        seen := map[string]bool{}
        for _, d := range site.Domain {
            line := convertDomain(d, cp.Policy)
            if seen[line] { continue }
            seen[line] = true
            b.WriteString(line+"\n")
            ruleCount++
            categoryCounts[strings.ToLower(cp.Name)]++
        }
    }
'''
          p.write_text(s[:start]+new+s[end:])
          PY
          gofmt -w scripts/build_client_bundle.go
          grep -q 'All managed PROXY rules must precede all managed DIRECT rules' scripts/build_client_bundle.go
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build_client_bundle.go
          git rm .github/workflows/fix-managed-shadow-order-once.yml
          git commit -m 'Place all managed Shadowrocket PROXY rules before DIRECT'
          git push origin HEAD:build-ru-blocked-server-allow-20260826
