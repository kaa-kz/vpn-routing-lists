name: Fix client bundle Go tidy once

on:
  push:
    branches:
      - build-ru-blocked-server-allow-20260826
    paths:
      - '.github/workflows/fix-client-bundle-go-tidy-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-ru-blocked-server-allow-20260826
          fetch-depth: 0
      - name: Patch orchestrator Go workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/client_bundle_orchestrator.py')
          s=p.read_text()
          old='''    subprocess.run(["go", "mod", "download"], cwd=module_dir, check=True)\n    cmd = [\n        "go", "run", str(GO_BUILDER),'''
          new='''    shutil.copy2(GO_BUILDER, module_dir / "main.go")\n    subprocess.run(["go", "mod", "tidy"], cwd=module_dir, check=True)\n    cmd = [\n        "go", "run", ".",'''
          if old not in s:
              raise SystemExit('patch anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile scripts/client_bundle_orchestrator.py
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/client_bundle_orchestrator.py
          git rm .github/workflows/fix-client-bundle-go-tidy-once.yml
          git commit -m 'Run client builder inside temporary Go module'
          git push origin HEAD:build-ru-blocked-server-allow-20260826
