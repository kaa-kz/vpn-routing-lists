# Example Shadowrocket rule fragment using the generated remote list.
# Place explicit DIRECT exceptions before the RULE-SET because Shadowrocket
# evaluates rules top-to-bottom and stops at the first match.

[Rule]
DOMAIN,cloudflare-dns.com,DIRECT
RULE-SET,https://raw.githubusercontent.com/kaa-kz/vpn-routing-lists/release/shadowrocket-ru-blocked.list,PROXY
FINAL,DIRECT
